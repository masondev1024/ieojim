name: Verify
on: [push, pull_request]
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - run: npm run cf:types
      - name: Typecheck
        run: npm run typecheck
      - name: Lint
        run: npm run lint
      - name: Unit tests
        run: npm run test:unit
      - name: Workers and D1 integration tests
        timeout-minutes: 5
        # Keep native console output; avoid cross-context log RPC stalls in the Workers test plugin.
        # Reassess after https://github.com/cloudflare/workers-sdk/pull/15565 is released.
        run: npm run test:integration -- --reporter=verbose --disableConsoleIntercept
      - name: Build
        run: npm run build
      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e
      - run: npm run eval:live -- --dry-run
      - run: node --import tsx scripts/deploy-readiness.ts --target=staging --allow-unprovisioned
      - run: node --import tsx scripts/deploy-readiness.ts --target=production --allow-unprovisioned
      - run: npm run release:prepare
      - uses: actions/upload-artifact@v4
        with:
          name: release-candidate
          path: artifacts/release-candidate
          retention-days: 7
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-failures
          path: |
            playwright-report
            test-results
          retention-days: 7
